services:
  frontend:
    env_file:
      - .env.local
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    restart: unless-stopped
